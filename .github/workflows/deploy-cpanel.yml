name: Deploy to cPanel

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build cPanel static site
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: "1"
          SKIP_CPANEL_ZIP: "1"
        run: npm run build:cpanel

      - name: Verify static build
        run: |
          test -d out
          test -f out/index.html
          test -f out/images/imm.png
          test -f out/about/index.html
          echo "Build verification successful."

      - name: Deploy to cPanel via FTP
        id: ftp_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: /
          log-level: minimal
          timeout: 600000
          security: loose
          # Keep defaults + skip zip if ever present; state file enables incremental sync
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/cpanel-upload.zip
            **/.DS_Store

      - name: Retry FTP deploy
        id: ftp_retry
        if: steps.ftp_deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: /
          log-level: minimal
          timeout: 600000
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/cpanel-upload.zip
            **/.DS_Store

      - name: Fail if FTP deploy did not succeed
        if: always() && steps.ftp_deploy.outcome == 'failure' && steps.ftp_retry.outcome != 'success'
        run: |
          echo "FTP deploy failed after retry."
          exit 1
