name: Deploy to cPanel

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build cPanel static site
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: "1"
          SKIP_CPANEL_ZIP: "1"
        run: npm run build:cpanel

      - name: Verify static build
        run: |
          test -d out
          test -f out/index.html
          test -f out/images/imm.png
          test -f out/about/index.html
          test -f out/blog/index.html
          echo "Build verified: $(find out -type f | wc -l) files."

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Fails fast without uploading anything if the host is down, so a partial
      # upload can never take the live site offline.
      - name: Deploy to cPanel via FTPS
        timeout-minutes: 15
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/deploy-cpanel-ftp.mjs

      - name: Verify site is live
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://albatrozsolutions.com/ || echo 000)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Site is live."
              exit 0
            fi
            sleep 15
          done
          echo "Site did not return HTTP 200 after deploy."
          exit 1
