name: Deploy to cPanel

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Stop live FTPS upload
        run: |
          echo "Skipping cPanel FTP so the in-progress lftp upload is cancelled"
          echo "and Apache can come back up. Do not upload while the site is down."
